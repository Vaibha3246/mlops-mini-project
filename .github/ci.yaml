name: ci pipeline

on: push

job :
   project-testing:
     runs-on: ubuntu-latest 

     steps:
      -name: checkout repo
      uses: actions/checkout@v3

      -name: set up python 
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
      -name: install dependencies
      runs: |
       python -m pip install --upgrade pip
       pip install requiremets.txt
       pip install pytest

      -name: run pipeline 
      runs: |
        dvc repro

    